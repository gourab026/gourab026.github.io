repository: gourab026/gourab026.github.io

output: web

topnav_title: Gourab Das
site_title: Gourab Das - Portfolio & Blog
company_name: Gourab Das

github_editme_path: gourab026/gourab026.github.io/blob/main/

google_analytics: ""

host: 127.0.0.1
port: 4000

exclude:
  - .idea/
  - .gitignore
  - vendor
  - Gemfile
  - Gemfile.lock
  - docker-compose.yml
  - Dockerfile
  - createtag
  - scripts
  - var

feedback_subject_line: Feedback
feedback_email: ""

highlighter: rouge

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag

defaults:
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      comments: false
      search: true
      sidebar: home_sidebar
      topnav: topnav
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      search: true
      sidebar: blog_sidebar
      topnav: topnav

sidebars:
  - home_sidebar
  - blog_sidebar
  - portfolio_sidebar

description: "Gourab Das - Cybersecurity professional, developer, and technical writer. Portfolio of projects, blog posts, and work in progress."
