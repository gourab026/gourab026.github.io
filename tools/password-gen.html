<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator — Tools</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #FAF9F5; --surface: #F4F2EC; --border: #E4E0D6;
  --ink: #18181B; --ink-2: #3F3F46; --ink-4: #A1A1AA;
  --accent: #B4541A; --accent-hover: #933F10;
  --font: -apple-system,'Inter',BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono: 'JetBrains Mono','Fira Code',monospace;
  --r: 8px;
}
body { font-family: var(--font); background: var(--bg); color: var(--ink); line-height: 1.6; padding: 2rem 1rem 4rem; -webkit-font-smoothing: antialiased; }
.container { max-width: 580px; margin: 0 auto; }
.back { font-size: 13px; color: var(--ink-4); text-decoration: none; display: inline-block; margin-bottom: 2rem; }
.back:hover { color: var(--accent); }
h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.3rem; }
.subtitle { font-size: 14px; color: var(--ink-2); margin-bottom: 2rem; }

.pw-box {
  background: white; border: 1px solid var(--border); border-radius: var(--r);
  padding: 1rem 1.25rem; display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem;
}
#pw-output {
  font-family: var(--mono); font-size: 15px; color: var(--ink); flex: 1;
  word-break: break-all; line-height: 1.6; min-height: 1.6em; letter-spacing: 0.02em;
}
.pw-btns { display: flex; gap: 0.4rem; flex-shrink: 0; }
.btn-sm {
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 11px; cursor: pointer; font-size: 12px; color: var(--ink-2);
  font-family: var(--font); transition: border-color 0.15s, color 0.15s; white-space: nowrap;
}
.btn-sm:hover { border-color: var(--accent); color: var(--accent); }
.btn-sm.ok { border-color: #16a34a; color: #16a34a; }

.strength-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.75rem; }
.strength-bar { flex: 1; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.strength-fill { height: 100%; border-radius: 2px; width: 0; transition: width 0.25s, background 0.25s; }
.strength-text { font-size: 12px; font-family: var(--mono); width: 80px; text-align: right; transition: color 0.2s; }

.card { background: white; border: 1px solid var(--border); border-radius: var(--r); padding: 0 1.5rem; margin-bottom: 1rem; }
.row { display: flex; align-items: center; justify-content: space-between; padding: 0.8rem 0; }
.row + .row { border-top: 1px solid var(--surface); }
.row-label { font-size: 14px; color: var(--ink); }
.row-sub { font-size: 11px; color: var(--ink-4); margin-top: 1px; }

.length-control { display: flex; align-items: center; gap: 0.75rem; }
input[type=range] {
  -webkit-appearance: none; appearance: none; width: 150px; height: 3px;
  background: var(--border); border-radius: 2px; cursor: pointer; outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
  border-radius: 50%; background: var(--accent); cursor: pointer; border: 2px solid white;
  box-shadow: 0 0 0 1px var(--accent);
}
.length-num { font-family: var(--mono); font-size: 14px; color: var(--accent); width: 30px; text-align: right; }

.toggle { position: relative; display: inline-block; width: 36px; height: 20px; cursor: pointer; }
.toggle input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; inset: 0; background: var(--border); border-radius: 10px; transition: 0.2s; }
.slider::before {
  content: ''; position: absolute; width: 14px; height: 14px;
  border-radius: 50%; left: 3px; bottom: 3px; background: white; transition: 0.2s;
}
.toggle input:checked + .slider { background: var(--accent); }
.toggle input:checked + .slider::before { transform: translateX(16px); }

.btn-gen {
  width: 100%; background: var(--accent); color: white; border: none;
  border-radius: var(--r); padding: 0.75rem; font-size: 14px; font-weight: 600;
  cursor: pointer; font-family: var(--font); transition: background 0.15s; letter-spacing: 0.01em;
}
.btn-gen:hover { background: var(--accent-hover); }

.entropy-note { font-size: 11px; color: var(--ink-4); text-align: center; margin-top: 0.6rem; font-family: var(--mono); }

footer { margin-top: 3rem; font-size: 12px; color: var(--ink-4); text-align: center; }
footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back">← Back to tools</a>
  <h1>Password Generator</h1>
  <p class="subtitle">Cryptographically random. Runs entirely in your browser — nothing is sent anywhere.</p>

  <div class="pw-box">
    <div id="pw-output">—</div>
    <div class="pw-btns">
      <button class="btn-sm" id="copy-btn">Copy</button>
      <button class="btn-sm" id="regen-btn" title="Regenerate">↻</button>
    </div>
  </div>

  <div class="strength-row">
    <div class="strength-bar"><div class="strength-fill" id="s-fill"></div></div>
    <div class="strength-text" id="s-label"></div>
  </div>

  <div class="card">
    <div class="row">
      <div class="row-label">Length</div>
      <div class="length-control">
        <input type="range" id="len" min="8" max="128" value="20">
        <span class="length-num" id="len-num">20</span>
      </div>
    </div>
    <div class="row">
      <div class="row-label">Uppercase (A–Z)</div>
      <label class="toggle"><input type="checkbox" id="upper" checked><span class="slider"></span></label>
    </div>
    <div class="row">
      <div class="row-label">Lowercase (a–z)</div>
      <label class="toggle"><input type="checkbox" id="lower" checked><span class="slider"></span></label>
    </div>
    <div class="row">
      <div class="row-label">Numbers (0–9)</div>
      <label class="toggle"><input type="checkbox" id="nums" checked><span class="slider"></span></label>
    </div>
    <div class="row">
      <div class="row-label">Symbols (!@#$…)</div>
      <label class="toggle"><input type="checkbox" id="syms" checked><span class="slider"></span></label>
    </div>
    <div class="row">
      <div>
        <div class="row-label">Exclude ambiguous</div>
        <div class="row-sub">Removes 0 O l 1 I |</div>
      </div>
      <label class="toggle"><input type="checkbox" id="noamb"><span class="slider"></span></label>
    </div>
  </div>

  <button class="btn-gen" id="gen-btn">Generate New Password</button>
  <div class="entropy-note" id="entropy-note"></div>
</div>

<footer><a href="../index.html">gourab026.github.io</a></footer>

<script>
const UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const LOWER = 'abcdefghijklmnopqrstuvwxyz';
const NUMS  = '0123456789';
const SYMS  = '!@#$%^&*()-_=+[]{}|;:,.<>?/~';
const AMBIG = new Set('0Ol1I|');

function pool() {
  const noAmb = document.getElementById('noamb').checked;
  const keep = c => !noAmb || !AMBIG.has(c);
  let p = '';
  if (document.getElementById('upper').checked) p += [...UPPER].filter(keep).join('');
  if (document.getElementById('lower').checked) p += [...LOWER].filter(keep).join('');
  if (document.getElementById('nums').checked)  p += [...NUMS].filter(keep).join('');
  if (document.getElementById('syms').checked)  p += [...SYMS].filter(keep).join('');
  return p;
}

function generate() {
  const len = +document.getElementById('len').value;
  const p = pool();
  if (!p) { document.getElementById('pw-output').textContent = '— enable at least one option —'; return; }
  const rnd = new Uint32Array(len);
  crypto.getRandomValues(rnd);
  document.getElementById('pw-output').textContent = Array.from(rnd, n => p[n % p.length]).join('');
  renderStrength(len, p.length);
}

function renderStrength(len, pSize) {
  const bits = len * Math.log2(pSize);
  const fill  = document.getElementById('s-fill');
  const label = document.getElementById('s-label');
  const note  = document.getElementById('entropy-note');
  const [pct, col, word] =
    bits < 40  ? [12,  '#ef4444', 'Weak']       :
    bits < 60  ? [38,  '#f97316', 'Fair']        :
    bits < 80  ? [65,  '#eab308', 'Strong']      :
    bits < 100 ? [84,  '#22c55e', 'Very strong'] :
                 [100, '#15803d', 'Excellent'];
  fill.style.width = pct + '%';
  fill.style.background = col;
  label.style.color = col;
  label.textContent = word;
  note.textContent = Math.round(bits) + ' bits of entropy · pool size ' + pSize;
}

document.getElementById('gen-btn').addEventListener('click', generate);
document.getElementById('regen-btn').addEventListener('click', generate);
document.getElementById('len').addEventListener('input', function() {
  document.getElementById('len-num').textContent = this.value;
  generate();
});
['upper','lower','nums','syms','noamb'].forEach(id =>
  document.getElementById(id).addEventListener('change', generate)
);
document.getElementById('copy-btn').addEventListener('click', function() {
  const pw = document.getElementById('pw-output').textContent;
  if (pw.startsWith('—')) return;
  navigator.clipboard.writeText(pw).then(() => {
    this.textContent = 'Copied!';
    this.classList.add('ok');
    setTimeout(() => { this.textContent = 'Copy'; this.classList.remove('ok'); }, 1800);
  });
});

generate();
</script>
</body>
</html>
