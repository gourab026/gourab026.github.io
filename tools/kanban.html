<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban — Tools</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #FAF9F5;
  --surface:  #FFFFFF;
  --col-bg:   #F1EFE9;
  --border:   #E4E0D6;
  --border-2: #CCC8BE;
  --ink:      #18181B;
  --ink-2:    #3F3F46;
  --ink-3:    #71717A;
  --ink-4:    #A1A1AA;
  --accent:   #B4541A;
  --font: -apple-system, 'Inter', BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', 'Fira Code', monospace;
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
}

/* ── Header ────────────────────────────────────── */
.kb-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px;
  height: 52px;
  border-bottom: 1px solid var(--border);
  background: rgba(250,249,245,0.95);
  backdrop-filter: blur(8px);
  flex-shrink: 0;
  z-index: 10;
}

.kb-back {
  font-size: 12px;
  color: var(--ink-4);
  text-decoration: none;
  white-space: nowrap;
}
.kb-back:hover { color: var(--accent); }

.kb-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  border: 1px solid transparent;
  border-radius: 5px;
  padding: 3px 7px;
  outline: none;
  min-width: 60px;
  max-width: 260px;
  cursor: text;
}
.kb-title:hover { border-color: var(--border-2); }
.kb-title:focus { border-color: var(--accent); background: var(--surface); }

.kb-hdr-sep { flex: 1; }

.kb-hdr-btn {
  font-size: 12px;
  font-family: var(--font);
  padding: 5px 12px;
  border-radius: 5px;
  border: 1px solid var(--border-2);
  background: transparent;
  color: var(--ink-2);
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.1s, color 0.1s;
}
.kb-hdr-btn:hover { background: var(--col-bg); color: var(--ink); }
.kb-hdr-btn.primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.kb-hdr-btn.primary:hover { background: #933F10; }

/* ── Board ─────────────────────────────────────── */
.kb-board {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 18px 20px 18px;
  overflow-x: auto;
  overflow-y: hidden;
  flex: 1;
  min-height: 0;
}

/* ── Column ────────────────────────────────────── */
.kb-col {
  display: flex;
  flex-direction: column;
  width: 272px;
  min-width: 272px;
  max-height: 100%;
  background: var(--col-bg);
  border-radius: 10px;
  border: 1px solid var(--border);
  overflow: hidden;
  flex-shrink: 0;
}

.kb-col-strip {
  height: 4px;
  flex-shrink: 0;
}

.kb-col-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 12px 8px;
  flex-shrink: 0;
}

.kb-col-title {
  flex: 1;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  outline: none;
  border: 1px solid transparent;
  border-radius: 4px;
  padding: 2px 5px;
  cursor: text;
  word-break: break-word;
  line-height: 1.4;
}
.kb-col-title:hover { border-color: var(--border-2); }
.kb-col-title:focus { border-color: var(--accent); background: #fff; }

.kb-col-count {
  font-size: 11px;
  font-family: var(--mono);
  color: var(--ink-4);
  background: var(--border);
  border-radius: 10px;
  padding: 1px 6px;
  flex-shrink: 0;
}

.kb-col-del {
  width: 22px;
  height: 22px;
  border: none;
  background: none;
  color: var(--ink-4);
  font-size: 16px;
  cursor: pointer;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  opacity: 0;
  transition: opacity 0.15s, background 0.1s, color 0.1s;
}
.kb-col:hover .kb-col-del { opacity: 1; }
.kb-col-del:hover { background: #fde8e8; color: #c0392b; }

/* ── Cards area ────────────────────────────────── */
.kb-cards {
  flex: 1;
  overflow-y: auto;
  padding: 2px 10px 6px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  min-height: 24px;
}

/* scrollbar */
.kb-cards::-webkit-scrollbar { width: 4px; }
.kb-cards::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }

/* drop placeholder */
.kb-placeholder {
  height: 58px;
  border: 2px dashed var(--accent);
  border-radius: 7px;
  background: rgba(180,84,26,0.05);
  flex-shrink: 0;
}

/* ── Card ──────────────────────────────────────── */
.kb-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 9px 10px 8px;
  cursor: grab;
  position: relative;
  transition: box-shadow 0.15s, transform 0.15s, opacity 0.15s;
  flex-shrink: 0;
}
.kb-card:hover {
  box-shadow: 0 2px 8px rgba(24,24,27,0.08);
  border-color: var(--border-2);
}
.kb-card.dragging {
  opacity: 0.4;
  cursor: grabbing;
}

/* color label bar on left edge */
.kb-card.has-label::before {
  content: '';
  position: absolute;
  left: 0;
  top: 6px;
  bottom: 6px;
  width: 3px;
  border-radius: 0 2px 2px 0;
  background: var(--card-label);
}
.kb-card.has-label { padding-left: 13px; }

.kb-card-body {
  display: flex;
  align-items: flex-start;
  gap: 6px;
}

.kb-drag-handle {
  color: var(--ink-4);
  font-size: 13px;
  cursor: grab;
  flex-shrink: 0;
  margin-top: 1px;
  opacity: 0;
  transition: opacity 0.1s;
  user-select: none;
}
.kb-card:hover .kb-drag-handle { opacity: 1; }

.kb-card-text {
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.5;
  flex: 1;
  word-break: break-word;
  cursor: text;
}
.kb-card-text:empty::before { content: attr(data-placeholder); color: var(--ink-4); }

.kb-card-edit {
  font-size: 13px;
  font-family: var(--font);
  color: var(--ink);
  line-height: 1.5;
  flex: 1;
  border: none;
  outline: none;
  resize: none;
  background: transparent;
  width: 100%;
  min-height: 40px;
}

.kb-card-footer {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  margin-top: 6px;
  opacity: 0;
  transition: opacity 0.1s;
}
.kb-card:hover .kb-card-footer { opacity: 1; }

.kb-icon-btn {
  font-size: 12px;
  font-family: var(--font);
  padding: 2px 6px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: transparent;
  color: var(--ink-3);
  cursor: pointer;
  transition: background 0.1s, color 0.1s, border-color 0.1s;
  line-height: 1.4;
}
.kb-icon-btn:hover { background: var(--col-bg); color: var(--ink); border-color: var(--border-2); }
.kb-icon-btn.del:hover { background: #fde8e8; color: #c0392b; border-color: #f5c2c2; }

/* ── Add card ──────────────────────────────────── */
.kb-col-footer {
  padding: 6px 10px 10px;
  flex-shrink: 0;
}

.kb-add-row {
  display: flex;
  gap: 6px;
  align-items: flex-end;
}

.kb-add-input {
  flex: 1;
  font-size: 13px;
  font-family: var(--font);
  color: var(--ink);
  border: 1px solid var(--border-2);
  border-radius: 6px;
  padding: 6px 9px;
  background: var(--surface);
  resize: none;
  outline: none;
  min-height: 34px;
  max-height: 120px;
  overflow-y: auto;
  transition: border-color 0.15s;
}
.kb-add-input::placeholder { color: var(--ink-4); }
.kb-add-input:focus { border-color: var(--accent); }

.kb-add-submit {
  font-size: 12px;
  font-family: var(--font);
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  height: 34px;
  transition: background 0.1s;
}
.kb-add-submit:hover { background: #933F10; }

/* ── Add column ghost ──────────────────────────── */
.kb-add-col {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 200px;
  min-width: 200px;
  min-height: 80px;
  border: 2px dashed var(--border-2);
  border-radius: 10px;
  font-size: 13px;
  color: var(--ink-4);
  cursor: pointer;
  background: transparent;
  font-family: var(--font);
  transition: border-color 0.15s, color 0.15s, background 0.15s;
  flex-shrink: 0;
  align-self: stretch;
}
.kb-add-col:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(180,84,26,0.03);
}

/* ── Label picker ──────────────────────────────── */
.kb-label-picker {
  position: fixed;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 4px 16px rgba(24,24,27,0.12);
  padding: 8px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  width: 164px;
  z-index: 1000;
}

.kb-swatch {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  transition: transform 0.1s;
}
.kb-swatch:hover { transform: scale(1.2); }
.kb-swatch.active { border-color: var(--ink); }
.kb-swatch.none-swatch {
  background: var(--col-bg);
  border-color: var(--border-2);
  color: var(--ink-4);
  font-size: 16px;
}

/* ── Empty column message ──────────────────────── */
.kb-empty {
  font-size: 12px;
  color: var(--ink-4);
  text-align: center;
  padding: 12px 0 6px;
  pointer-events: none;
}

/* ── Scrollbar (board) ─────────────────────────── */
.kb-board::-webkit-scrollbar { height: 6px; }
.kb-board::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }
</style>
</head>
<body>

<header class="kb-header">
  <a class="kb-back" href="index.html">← Tools</a>
  <div contenteditable="true" id="board-title" class="kb-title" spellcheck="false">My Board</div>
  <div class="kb-hdr-sep"></div>
  <button class="kb-hdr-btn" onclick="exportBoard()">Export JSON</button>
  <button class="kb-hdr-btn" onclick="importBoard()">Import JSON</button>
  <button class="kb-hdr-btn primary" onclick="confirmReset()">New Board</button>
</header>

<div class="kb-board" id="board"></div>

<script>
'use strict';

// ─── Constants ─────────────────────────────────────────────────
const COL_COLORS = ['#6366f1','#f59e0b','#10b981','#ef4444','#8b5cf6','#06b6d4','#ec4899','#f43f5e'];
const LABEL_COLORS = [null,'#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#8b5cf6','#ec4899'];
const STORAGE_KEY = 'kb-board-v1';

// ─── State ─────────────────────────────────────────────────────
let state = defaultState();
let drag = { cardId: null, fromColId: null };
let placeholder = null;

function defaultState() {
  return {
    title: 'My Board',
    columns: [
      { id: uid(), title: 'To Do',       color: COL_COLORS[0], cards: [] },
      { id: uid(), title: 'In Progress', color: COL_COLORS[1], cards: [] },
      { id: uid(), title: 'Done',        color: COL_COLORS[2], cards: [] }
    ]
  };
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

// ─── Persistence ───────────────────────────────────────────────
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (s && Array.isArray(s.columns)) state = s;
  } catch {}
}

// ─── Mutations ─────────────────────────────────────────────────
function addColumn() {
  const color = COL_COLORS[state.columns.length % COL_COLORS.length];
  const col = { id: uid(), title: 'New Column', color, cards: [] };
  state.columns.push(col);
  save();
  render();
  // Focus the new column title
  const titles = document.querySelectorAll('.kb-col-title');
  const last = titles[titles.length - 1];
  if (last) { last.focus(); selectAll(last); }
}

function removeColumn(colId) {
  const col = state.columns.find(c => c.id === colId);
  if (!col) return;
  const msg = col.cards.length
    ? `Delete "${col.title}" and its ${col.cards.length} card(s)?`
    : `Delete "${col.title}"?`;
  if (!col.cards.length || confirm(msg)) {
    state.columns = state.columns.filter(c => c.id !== colId);
    save(); render();
  }
}

function renameColumn(colId, title) {
  const col = state.columns.find(c => c.id === colId);
  if (col && title.trim()) { col.title = title.trim(); save(); }
}

function addCard(colId, text) {
  if (!text.trim()) return;
  const col = state.columns.find(c => c.id === colId);
  if (col) { col.cards.push({ id: uid(), text: text.trim(), label: null }); save(); render(); }
}

function updateCard(colId, cardId, text) {
  const card = findCard(colId, cardId);
  if (card && text.trim()) { card.text = text.trim(); save(); }
}

function removeCard(colId, cardId) {
  const col = state.columns.find(c => c.id === colId);
  if (col) { col.cards = col.cards.filter(c => c.id !== cardId); save(); render(); }
}

function setLabel(colId, cardId, label) {
  const card = findCard(colId, cardId);
  if (card) { card.label = label; save(); render(); }
}

function moveCard(cardId, fromColId, toColId, beforeCardId) {
  const from = state.columns.find(c => c.id === fromColId);
  const to   = state.columns.find(c => c.id === toColId);
  if (!from || !to) return;
  const idx = from.cards.findIndex(c => c.id === cardId);
  if (idx === -1) return;
  const [card] = from.cards.splice(idx, 1);
  if (beforeCardId) {
    const bi = to.cards.findIndex(c => c.id === beforeCardId);
    to.cards.splice(bi === -1 ? to.cards.length : bi, 0, card);
  } else {
    to.cards.push(card);
  }
  save(); render();
}

function findCard(colId, cardId) {
  return state.columns.find(c => c.id === colId)?.cards.find(c => c.id === cardId);
}

// ─── Render ─────────────────────────────────────────────────────
function render() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  state.columns.forEach(col => board.appendChild(buildColumn(col)));

  // Add column button
  const ghost = document.createElement('button');
  ghost.className = 'kb-add-col';
  ghost.textContent = '+ Add column';
  ghost.onclick = addColumn;
  board.appendChild(ghost);

  // Sync board title
  const titleEl = document.getElementById('board-title');
  if (document.activeElement !== titleEl) titleEl.textContent = state.title;
}

function buildColumn(col) {
  const el = document.createElement('div');
  el.className = 'kb-col';
  el.dataset.colId = col.id;

  // Color strip
  const strip = document.createElement('div');
  strip.className = 'kb-col-strip';
  strip.style.background = col.color;
  el.appendChild(strip);

  // Header
  const header = document.createElement('div');
  header.className = 'kb-col-header';

  const titleEl = document.createElement('div');
  titleEl.className = 'kb-col-title';
  titleEl.contentEditable = 'true';
  titleEl.spellcheck = false;
  titleEl.textContent = col.title;
  titleEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); }
    if (e.key === 'Escape') { titleEl.textContent = col.title; titleEl.blur(); }
  });
  titleEl.addEventListener('blur', () => renameColumn(col.id, titleEl.textContent));

  const count = document.createElement('span');
  count.className = 'kb-col-count';
  count.textContent = col.cards.length;

  const delBtn = document.createElement('button');
  delBtn.className = 'kb-col-del';
  delBtn.title = 'Delete column';
  delBtn.innerHTML = '&times;';
  delBtn.onclick = () => removeColumn(col.id);

  header.append(titleEl, count, delBtn);
  el.appendChild(header);

  // Cards
  const cards = document.createElement('div');
  cards.className = 'kb-cards';
  cards.dataset.colId = col.id;

  if (col.cards.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'kb-empty';
    empty.textContent = 'No cards yet';
    cards.appendChild(empty);
  } else {
    col.cards.forEach(card => cards.appendChild(buildCard(card, col.id)));
  }

  // DnD on cards container
  cards.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    ensurePlaceholder();
    const after = dragAfterElement(cards, e.clientY);
    if (after) cards.insertBefore(placeholder, after);
    else cards.appendChild(placeholder);
  });

  cards.addEventListener('dragleave', e => {
    if (!cards.contains(e.relatedTarget)) placeholder?.remove();
  });

  cards.addEventListener('drop', e => {
    e.preventDefault();
    if (!drag.cardId) return;
    const afterEl = placeholder?.nextElementSibling;
    const beforeId = afterEl?.dataset?.cardId || null;
    moveCard(drag.cardId, drag.fromColId, col.id, beforeId);
  });

  el.appendChild(cards);

  // Footer — add card
  const footer = document.createElement('div');
  footer.className = 'kb-col-footer';

  const row = document.createElement('div');
  row.className = 'kb-add-row';

  const input = document.createElement('textarea');
  input.className = 'kb-add-input';
  input.placeholder = 'Add a card…';
  input.rows = 1;
  input.addEventListener('input', () => autoResize(input));
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submitAdd(col.id, input);
    }
    if (e.key === 'Escape') { input.value = ''; autoResize(input); input.blur(); }
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'kb-add-submit';
  addBtn.textContent = 'Add';
  addBtn.onclick = () => submitAdd(col.id, input);

  row.append(input, addBtn);
  footer.appendChild(row);
  el.appendChild(footer);

  return el;
}

function buildCard(card, colId) {
  const el = document.createElement('div');
  el.className = 'kb-card' + (card.label ? ' has-label' : '');
  el.draggable = true;
  el.dataset.cardId = card.id;
  if (card.label) el.style.setProperty('--card-label', card.label);

  const body = document.createElement('div');
  body.className = 'kb-card-body';

  const handle = document.createElement('div');
  handle.className = 'kb-drag-handle';
  handle.innerHTML = '&#8942;&#8942;';
  handle.title = 'Drag to move';

  const textEl = document.createElement('div');
  textEl.className = 'kb-card-text';
  textEl.textContent = card.text;

  // Inline edit on click
  textEl.addEventListener('click', () => startEdit(el, textEl, card, colId));

  body.append(handle, textEl);
  el.appendChild(body);

  // Footer: label + delete
  const footer = document.createElement('div');
  footer.className = 'kb-card-footer';

  const labelBtn = document.createElement('button');
  labelBtn.className = 'kb-icon-btn';
  labelBtn.title = 'Set label';
  if (card.label) {
    labelBtn.innerHTML = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${card.label};vertical-align:middle;margin-right:3px"></span>Label`;
  } else {
    labelBtn.textContent = 'Label';
  }
  labelBtn.onclick = e => { e.stopPropagation(); showLabelPicker(labelBtn, colId, card.id, card.label); };

  const delBtn = document.createElement('button');
  delBtn.className = 'kb-icon-btn del';
  delBtn.title = 'Delete card';
  delBtn.textContent = 'Delete';
  delBtn.onclick = e => { e.stopPropagation(); removeCard(colId, card.id); };

  footer.append(labelBtn, delBtn);
  el.appendChild(footer);

  // Drag events
  el.addEventListener('dragstart', e => {
    drag = { cardId: card.id, fromColId: colId };
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', card.id);
    ensurePlaceholder();
    setTimeout(() => el.classList.add('dragging'), 0);
  });

  el.addEventListener('dragend', () => {
    drag = { cardId: null, fromColId: null };
    placeholder?.remove();
    placeholder = null;
    el.classList.remove('dragging');
  });

  return el;
}

function startEdit(cardEl, textEl, card, colId) {
  if (cardEl.querySelector('.kb-card-edit')) return; // already editing

  const ta = document.createElement('textarea');
  ta.className = 'kb-card-edit';
  ta.value = card.text;
  ta.rows = Math.max(2, (card.text.match(/\n/g) || []).length + 1);

  const doSave = () => {
    const val = ta.value.trim();
    ta.removeEventListener('blur', doSave);
    if (val && val !== card.text) { updateCard(colId, card.id, val); card.text = val; }
    textEl.textContent = card.text;
    ta.replaceWith(textEl);
  };

  ta.addEventListener('blur', doSave);
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ta.blur(); }
    if (e.key === 'Escape') {
      ta.removeEventListener('blur', doSave);
      ta.replaceWith(textEl);
    }
  });

  textEl.replaceWith(ta);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
}

// ─── DnD helpers ───────────────────────────────────────────────
function ensurePlaceholder() {
  if (!placeholder || !placeholder.isConnected) {
    placeholder = document.createElement('div');
    placeholder.className = 'kb-placeholder';
  }
}

function dragAfterElement(container, y) {
  const els = [...container.querySelectorAll('.kb-card:not(.dragging)')];
  let closest = null, minDist = Infinity;
  for (const el of els) {
    const { top, height } = el.getBoundingClientRect();
    const dist = y - (top + height / 2);
    if (dist < 0 && Math.abs(dist) < minDist) { minDist = Math.abs(dist); closest = el; }
  }
  return closest;
}

// ─── Label picker ──────────────────────────────────────────────
function showLabelPicker(anchor, colId, cardId, current) {
  document.querySelector('.kb-label-picker')?.remove();

  const picker = document.createElement('div');
  picker.className = 'kb-label-picker';

  LABEL_COLORS.forEach(color => {
    const sw = document.createElement('button');
    sw.className = 'kb-swatch' + (color === current ? ' active' : '');
    if (color) {
      sw.style.background = color;
      sw.title = color;
    } else {
      sw.classList.add('none-swatch');
      sw.textContent = '×';
      sw.title = 'No label';
    }
    sw.onclick = e => { e.stopPropagation(); setLabel(colId, cardId, color); picker.remove(); };
    picker.appendChild(sw);
  });

  const rect = anchor.getBoundingClientRect();
  picker.style.cssText = `top:${rect.bottom + 4}px;left:${Math.min(rect.left, window.innerWidth - 172)}px`;
  document.body.appendChild(picker);

  setTimeout(() => document.addEventListener('click', () => picker.remove(), { once: true }), 0);
}

// ─── Board title ───────────────────────────────────────────────
document.getElementById('board-title').addEventListener('blur', e => {
  const t = e.target.textContent.trim();
  state.title = t || 'My Board';
  if (!t) e.target.textContent = state.title;
  document.title = state.title + ' — Kanban';
  save();
});
document.getElementById('board-title').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
});

// ─── Helpers ───────────────────────────────────────────────────
function submitAdd(colId, input) {
  if (!input.value.trim()) return;
  addCard(colId, input.value);
  input.value = '';
  autoResize(input);
  input.focus();
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function selectAll(el) {
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

// ─── Export / Import ───────────────────────────────────────────
function exportBoard() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (state.title || 'board').replace(/\s+/g, '-').toLowerCase() + '.json';
  a.click();
}

function importBoard() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const s = JSON.parse(e.target.result);
        if (!Array.isArray(s.columns)) throw new Error();
        state = s;
        save();
        render();
        document.getElementById('board-title').textContent = state.title;
        document.title = state.title + ' — Kanban';
      } catch { alert('Invalid board JSON file.'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function confirmReset() {
  if (confirm('Start a new empty board? This will clear everything.')) {
    localStorage.removeItem(STORAGE_KEY);
    state = defaultState();
    render();
    document.getElementById('board-title').textContent = state.title;
    document.title = 'My Board — Kanban';
  }
}

// ─── Init ──────────────────────────────────────────────────────
load();
render();
document.getElementById('board-title').textContent = state.title;
document.title = state.title + ' — Kanban';
</script>
