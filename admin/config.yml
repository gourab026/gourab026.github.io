backend:
  name: git-gateway
  branch: main

media_folder: images
public_folder: /images

collections:
  - name: posts
    label: Blog Posts
    label_singular: Post
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "{{slug}}.html"
    fields:
      - { label: Title,     name: title,     widget: string }
      - label: Permalink
        name: permalink
        widget: string
        hint: "e.g. my-post-title.html — must be unique, becomes the page URL"
      - { label: Published, name: published, widget: boolean, default: true }
      - label: Tags
        name: tags
        widget: list
        hint: "cybersecurity, home-lab, python, osint, phishing-analysis, malware, ctf, automation, networking, web, tools, risk-management, governance, incident-response, identity, hardening"
      - { label: Summary,   name: summary,   widget: text,   required: false }
      - { label: Body,      name: body,      widget: markdown }
