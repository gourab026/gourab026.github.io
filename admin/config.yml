backend:
  name: github
  repo: gourab026/gourab026.github.io
  branch: main
  auth_type: pkce
  app_id: YOUR_CLIENT_ID   # replace this with your OAuth App Client ID

media_folder: images
public_folder: /images

collections:
  - name: posts
    label: Blog Posts
    label_singular: Post
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "{{slug}}.html"
    fields:
      - { label: Title,     name: title,     widget: string }
      - label: Permalink
        name: permalink
        widget: string
        hint: "Filename without date, e.g. my-post-title.html"
      - { label: Published, name: published, widget: boolean, default: true }
      - label: Tags
        name: tags
        widget: list
        hint: "Comma-separated. Use allowed tags: cybersecurity, home-lab, python, osint, phishing-analysis, malware, ctf, automation, networking, web, tools, risk-management, governance, incident-response, identity, hardening"
      - { label: Summary,   name: summary,   widget: text,   required: false }
      - { label: Body,      name: body,       widget: markdown }
